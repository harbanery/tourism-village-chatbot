services:
  postgres:
    image: postgres:16-alpine
    container_name: tourism-village-chatbot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tourism_village_chatbot
    ports:
      - "5432:5432"
    volumes:
      - tourism-village-chatbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tourism_village_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tourism-village-chatbot-pgdata:
