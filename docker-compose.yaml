services:
  postgres:
    image: postgres:16-alpine
    container_name: support-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_agent
    ports:
      - "5432:5432"
    volumes:
      - support-agent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support-agent-pgdata:
